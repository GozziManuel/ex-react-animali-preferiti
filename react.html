<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      function Modal({
        title,
        content,
        show = false,
        onClose = () => {},
        input,
        onChange,
        onConfirm,
        error,
        errorInput,
      }) {
        return (
          show &&
          ReactDOM.createPortal(
            <div className="modal-container">
              <div className="modal">
                <h2>{title}</h2>
                <label>Aggiungi il tuo animale qua!</label>
                <br />
                <input
                  type="text"
                  name="text"
                  onChange={onChange}
                  value={input}
                />
                <p>{content}</p>
                <button onClick={onClose}>Annulla</button>
                <button onClick={onConfirm}>Conferma</button>
                {error && (
                  <div>Nessun animale trovato nel nostro database!</div>
                )}
                {errorInput && <div>Input Vuoto riguarda meglio!</div>}
              </div>
            </div>,
            document.body,
          )
        );
      }

      const ListaAnimali = () => {
        const { useEffect } = React;
        const { useState } = React;
        const [numeri, setNumeri] = useState([]);
        const [show, setShow] = useState(false);
        const [input, setInput] = useState("");
        const [data, setData] = useState([]);
        const [error, setError] = useState(false);
        const [errorInput, setErrorInput] = useState(false);

        const handleTrace = (e) => {
          setInput(e.target.value);
        };
        const OnConfirm = async () => {
          if (input === "") {
            setErrorInput(true);
            setError(false);
          } else {
            setErrorInput(false);
            const animalArray = await getAnimalData(input);
            const AnimaleNuovo = animalArray[0];
            if (AnimaleNuovo === undefined) {
              setError(true);
            } else {
              setData((prev) => [...prev, AnimaleNuovo]);
              setShow(false);
              setError(false);
              setInput("");
            }
          }
        };

        const handleAsync = async (url) => {
          const response = await fetch(url);
          const obj = await response.json();
          return obj;
        };

        const getAnimalData = async (i) => {
          const animalFetch = await handleAsync(
            `http://localhost:3333/animals?search=${i}`,
          );
          return animalFetch;
        };

        return (
          <>
            <button onClick={() => setShow(true)}>Aggiungi Animale</button>
            <Modal
              title="Aggiungi Animale"
              show={show}
              onClose={() => setShow(false)}
              input={input}
              onChange={handleTrace}
              onConfirm={OnConfirm}
              error={error}
              errorInput={errorInput}
            />
            <details>
              <summary>
                <strong>Animali</strong>
              </summary>

              {data.length === 0 ? (
                <p>adesso è vuoto aggiungi un po' di gente</p>
              ) : (
                data.map((el, index) => {
                  return (
                    <>
                      <div className="card">
                        <h1>{el.name}</h1>
                        <p>{el.description}</p>
                        <img
                          src={el.image === true ? el.image : "/undefined.png"}
                          alt={el.name}
                        />
                      </div>
                    </>
                  );
                })
              )}
            </details>
          </>
        );
      };
    </script>
    <script type="text/babel">
      const { createRoot } = ReactDOM;

      const listaAnimali = document.querySelector(".lista-animali");
      const root = createRoot(listaAnimali);
      root.render(<ListaAnimali />);
    </script>
  </head>
  <body>
    <header>
      <h1>I miei animali Preferiti</h1>
    </header>
    <main>
      <figure>
        <img src="https://picsum.photos/400/300" alt="Immagine Casuale" />
      </figure>
      <div class="lista-animali"></div>
    </main>
    <footer>
      <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
  </body>
</html>
